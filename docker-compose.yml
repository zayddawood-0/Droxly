# Doxly local development stack (specs/devops.md §1-2, decisions.md ADR-006/ADR-015).
#
# STILL INCOMPLETE BY DESIGN: `postgres` and `redis` are added here (Phase 3
# needs a real Postgres+pgvector to run/test migrations against). `fastapi-app`
# and `worker` are not added yet — no application logic exists for them to run
# beyond the health check (exercised directly, not via Compose, for Phase 3's
# verification) — they arrive with Phase 2/5's actual routers and job consumer.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Placeholder — no backend exists yet to point at (specs/deployment.md §5.1).
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

  postgres:
    # pgvector/pgvector (not plain postgres + manual extension install) keeps
    # the pgvector version pinned identically across every machine and CI
    # (specs/devops.md §1).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doxly
      POSTGRES_PASSWORD: doxly
      POSTGRES_DB: doxly
    ports:
      - "5432:5432"
    volumes:
      - doxly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doxly -d doxly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  doxly-postgres-data:
