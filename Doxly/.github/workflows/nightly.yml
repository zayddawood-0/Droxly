# Doxly nightly workflow — the slower E2E + AI-regression tiers that
# deliberately don't block every PR (specs/testing.md §7: "the AI golden-set
# regression suite may run as a separate, slower CI job ... rather than
# blocking every PR"; specs/devops.md §6.1; roadmap.md Phase 18's
# "E2E/AI-eval (nightly)" task).

name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # playwright.config.ts's own webServer block builds and starts the
      # Next.js app (npm run build && npm run start on :3100) — no separate
      # server-startup step needed here.
      #
      # Current interim scope, matching testing.md §3's own documented
      # state: no real backend router exists yet for most domains
      # (devops.md §1.2), so this suite exercises the connectivity-error
      # path and route-smoke specs that exist today, not a fabricated "full
      # golden path against a real backend." No workflow change is needed
      # once real backend routers land — this already runs the full e2e/
      # directory.
      - name: Playwright E2E suite
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

  ai-eval:
    name: AI regression (LangGraph golden tier)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: doxly
          POSTGRES_PASSWORD: doxly
          POSTGRES_DB: doxly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doxly -d doxly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://doxly:doxly@localhost:5432/doxly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      # Current stand-in for testing.md §4.7's golden-set regression tier —
      # devops.md §6.1 documents in full why: the curated hallucination/
      # prompt-injection fixture sets (testing.md §4.5/§4.6) don't exist as
      # files yet, so this re-runs the LangGraph node tests (mocked
      # FakeLLMProvider) that verify graph control-flow and schema
      # validation, which is Phase 18's actual current content, not a claim
      # that the curated golden set already exists.
      - name: LangGraph node tests (AI regression stand-in)
        working-directory: backend
        run: pytest -q tests/test_graph_document_qa.py tests/test_graph_summarization.py tests/test_graph_extraction.py tests/test_graph_comparison.py
