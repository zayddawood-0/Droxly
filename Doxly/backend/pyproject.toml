[project]
name = "doxly-backend"
version = "0.1.0"
description = "Doxly FastAPI backend + worker (specs/decisions.md ADR-002, ADR-006)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pgvector>=0.3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.16",
  "black>=26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.core.database.engine is a module-level singleton (matching production
# usage) — its connection pool binds to whichever event loop existed when
# the first connection opened. pytest-asyncio's default is a fresh loop per
# test function, which orphans that pool on test 2 ("attached to a
# different loop"). Session-scoped keeps one loop for the whole run, matching
# the engine's actual lifetime.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
