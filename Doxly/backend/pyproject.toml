[project]
name = "doxly-backend"
version = "0.1.0"
description = "Doxly FastAPI backend + worker (specs/decisions.md ADR-002, ADR-006)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pgvector>=0.3.6",
  # tiktoken: rag.md §3 stores token_count "used ... to budget precisely
  # rather than estimating" — a real BPE tokenizer is what makes that true;
  # cl100k_base also matches the ADR-012 default embedding model's tokenizer.
  "tiktoken>=0.14",
  # httpx: the async HTTP client for EmbeddingProvider/LLMProvider calls
  # (skills/backend.md §13) — promoted from dev-only now that app/ai/ has a
  # real (if not yet default) OpenAI-calling provider.
  "httpx>=0.27",
  # LangGraph: the mandatory workflow engine for the four stateful AI
  # graphs (decisions.md ADR-004) — not hand-rolled orchestration.
  "langgraph>=1.2",
  # argon2-cffi: security.md §2.1 mandates argon2 (argon2id) password
  # hashing specifically — the direct library, not passlib's multi-algorithm
  # wrapper, since only one algorithm is ever used here (decisions.md ADR-010).
  "argon2-cffi>=23.1",
  # PyJWT: access-token issuance/verification (decisions.md ADR-010,
  # security.md §2.2) — HS256, minimal claim set.
  "pyjwt>=2.9",
  # Authlib: Google OAuth2 client (decisions.md ADR-010) — used via its
  # httpx-based async client, not the Starlette session-middleware
  # integration, to stay consistent with this project's existing httpx-based
  # provider pattern (app/ai/llm.py, app/ai/embeddings.py) rather than adding
  # a second HTTP client stack.
  "authlib>=1.3",
  # redis: the token-bucket rate-limit backend (decisions.md ADR-008's
  # Redis instance, reused here rather than provisioning a second store) and
  # the eventual RQ queue backend (roadmap.md Phase 5/8, still unimplemented
  # — this dependency is added now for rate limiting, not preemptively for
  # that unrelated future need).
  "redis>=5.2",
  # email-validator: pydantic's EmailStr type requires this as a runtime
  # extra (schemas/auth.py, schemas/user.py) — not bundled with pydantic
  # itself.
  "email-validator>=2.2",
  # rq: decisions.md ADR-008's background job queue (document processing,
  # embedding generation) — Redis-backed, actually wired up in R3
  # (tasks/remediation-plan.md); reuses the same Redis instance rate
  # limiting already depends on.
  "rq>=1.16",
  # pypdf/pdfplumber: decisions.md ADR-014's PDF extraction pair — pypdf for
  # structure/metadata (encryption detection), pdfplumber for the primary
  # text-extraction path (better layout fidelity for multi-column content).
  "pypdf>=5.1",
  "pdfplumber>=0.11",
  # python-docx: decisions.md ADR-014's DOCX extraction library.
  "python-docx>=1.1",
  # pandas: decisions.md ADR-014's CSV extraction library (robust
  # dialect/type inference); the stdlib csv module (already available) is
  # the documented lightweight fallback for small/edge-case files.
  "pandas>=2.2",
  # charset-normalizer: decisions.md ADR-014's TXT-parser encoding-detection
  # fallback for files that fail a plain UTF-8 decode (document-processing.md
  # §3.3) — declared explicitly rather than relied on as some other
  # dependency's transitive pin.
  "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.16",
  "black>=26.0",
  # devops.md §5 stage 2 mandates a backend type-check CI stage ("mypy (or
  # pyright)") — specified since Phase 1 but never wired to a dependency or
  # a CI job until Phase 18 actually built that stage.
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app.core.database.engine is a module-level singleton (matching production
# usage) — its connection pool binds to whichever event loop existed when
# the first connection opened. pytest-asyncio's default is a fresh loop per
# test function, which orphans that pool on test 2 ("attached to a
# different loop"). Session-scoped keeps one loop for the whole run, matching
# the engine's actual lifetime.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# skills/backend.md §7 mandates FastAPI's Depends()-in-default-argument
# pattern for dependency injection — R1 is the first task with real
# routers, so this is the first time ruff's B008 (normally a real bug
# elsewhere: a mutable/expensive default evaluated once at import time) has
# needed silencing for FastAPI's own idiomatic, documented use of it, where
# Depends() is called once per request by FastAPI's DI system, not once at
# import time. This is FastAPI's own recommended ruff configuration, not a
# blanket B008 suppression.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Query", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
# Several dependencies (langgraph's internal modules, tiktoken) don't ship
# type stubs or a py.typed marker Mypy fully resolves — ignoring missing
# imports for third-party packages, not this project's own code, keeps the
# CI gate meaningful (app/ itself is checked with no per-file exceptions).
ignore_missing_imports = true
