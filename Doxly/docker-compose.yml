# Doxly local development stack (specs/devops.md §1-2, decisions.md ADR-006/ADR-015).
#
# STILL INCOMPLETE BY DESIGN: `postgres` and `redis` are added here (Phase 3
# needs a real Postgres+pgvector to run/test migrations against). `worker`
# is added by R3 (tasks/remediation-plan.md) now that a real RQ job
# entrypoint exists (app/workers/document_processing_worker.py). A
# `fastapi-app` service is still NOT added — that gap predates R3 (R1/R2
# never added one either) and remains out of this task's scope; the backend
# is run directly (uvicorn) rather than via Compose until that's addressed.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Placeholder — no backend exists yet to point at (specs/deployment.md §5.1).
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    # roadmap.md Phase 17 (Docker) hardening: `init: true` runs Docker's
    # built-in tini as PID 1 so SIGTERM (docker compose stop/down) reaches
    # the Next.js server and shuts it down cleanly instead of the container
    # hanging until the stop timeout kills it. Healthcheck itself is defined
    # once, in frontend/Dockerfile's HEALTHCHECK — Compose reads it from the
    # built image rather than a second, duplicated definition here.
    init: true

  postgres:
    # pgvector/pgvector (not plain postgres + manual extension install) keeps
    # the pgvector version pinned identically across every machine and CI
    # (specs/devops.md §1).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doxly
      POSTGRES_PASSWORD: doxly
      POSTGRES_DB: doxly
    ports:
      - "5432:5432"
    volumes:
      - doxly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doxly -d doxly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    # tasks/remediation-plan.md R3 — the RQ consumer for
    # decisions.md ADR-008's document-processing queue (app/core/queue.py's
    # `document_processing` queue, app/workers/document_processing_worker.py's
    # job entrypoint). Same image as the backend (architecture.md §2.3:
    # "same codebase, same dependency layer — differing only in the
    # container's entrypoint command") — no separate Dockerfile.
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["rq", "worker", "document_processing", "--url", "redis://redis:6379"]
    environment:
      DATABASE_URL: postgresql+asyncpg://doxly:doxly@postgres:5432/doxly
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    init: true

volumes:
  doxly-postgres-data:
