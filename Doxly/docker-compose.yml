# Doxly local development stack (specs/devops.md §1-2, decisions.md ADR-006/ADR-015).
#
# R12 (tasks/remediation-plan.md, Production Deployment Readiness) closes
# the two gaps this file's previous revision explicitly flagged as
# out-of-scope-at-the-time:
#   1. `backend` (devops.md's `fastapi-app`) now exists — migrations run
#      automatically before uvicorn starts (devops.md §3 point 4's documented
#      "a new contributor never has to run a manual migration command").
#   2. `worker`'s command now lists all four RQ queues that exist as of R7
#      (document_processing/extraction/comparison/summary) — the previous
#      revision only ever consumed `document_processing`, so an
#      extraction/comparison/summary job enqueued via the API would sit in
#      Redis forever under `docker compose up` even though the exact same
#      job works when run directly (as every backend test in this suite
#      does). Not a hypothetical: confirmed by reading core/queue.py's four
#      queue-name constants directly against this file's old single-queue
#      command.

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    # roadmap.md Phase 17 (Docker) hardening: `init: true` runs Docker's
    # built-in tini as PID 1 so SIGTERM (docker compose stop/down) reaches
    # the Next.js server and shuts it down cleanly instead of the container
    # hanging until the stop timeout kills it. Healthcheck itself is defined
    # once, in frontend/Dockerfile's HEALTHCHECK — Compose reads it from the
    # built image rather than a second, duplicated definition here.
    init: true

  backend:
    # devops.md §1's `fastapi-app` — same image as `worker` (architecture.md
    # §2.3: "same codebase, same dependency layer, differing only in the
    # container's entrypoint command"), no separate Dockerfile.
    build:
      context: ./backend
      dockerfile: Dockerfile
    # devops.md §3 point 4 — migrations apply automatically on startup,
    # before the API accepts traffic; overrides the image's own CMD
    # (uvicorn only, no migration step — appropriate for the production
    # container platform, where migration is its own explicit, logged CI
    # deploy step per devops.md §8, not an implicit part of every container
    # start) the same way `worker`'s command already overrides it below.
    # `exec` before uvicorn (R12, deployment.md §3 "graceful shutdown"): without
    # it, uvicorn runs as a *child* of this `sh`, and `sh` does not relay a
    # forwarded SIGTERM to a child it's merely waiting on — `docker compose
    # stop`/a rolling deploy would then get no graceful drain at all and fall
    # straight through to SIGKILL after the stop grace period, dropping any
    # in-flight request (including a streaming chat response) mid-flight.
    # `exec` replaces the shell process with uvicorn itself so it receives
    # tini's forwarded SIGTERM directly and can drain before exiting.
    # `$${PORT:-8000}` (Railway pre-deployment verification finding J.1,
    # tasks/railway-pre-deployment-verification.md): Railway assigns a PORT
    # env var the app must bind to. The `$$` (not `$`) is required here
    # specifically because this is a Compose *file* — Compose itself
    # interpolates any bare `${VAR}` in a compose YAML value against the
    # *host's* shell environment/`.env` file at `docker compose up` time,
    # before the container ever starts; `$$` escapes that so Compose emits
    # a literal `${PORT:-8000}` into the command, which the *container's*
    # own `sh -c` then expands at runtime against its own environment
    # (no `PORT` is set below, so this falls back to 8000 — identical,
    # unaffected local behavior regardless of whatever `PORT` value might
    # happen to be set in the developer's own host shell).
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000}"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://doxly:doxly@postgres:5432/doxly
      REDIS_URL: redis://redis:6379
      BACKEND_PUBLIC_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      # STORAGE_PROVIDER=local (decisions.md ADR-022) writes uploaded bytes
      # to the container filesystem — `backend` (confirm-upload write) and
      # `worker` (processing-time read) are separate containers with
      # separate filesystems by default, so without a shared volume a
      # locally-uploaded document would be invisible to the worker that's
      # supposed to process it. Named (not bind-mounted), matching
      # `doxly-postgres-data`'s existing pattern below.
      - doxly-local-storage:/app/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    init: true

  postgres:
    # pgvector/pgvector (not plain postgres + manual extension install) keeps
    # the pgvector version pinned identically across every machine and CI
    # (specs/devops.md §1).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doxly
      POSTGRES_PASSWORD: doxly
      POSTGRES_DB: doxly
    ports:
      - "5432:5432"
    volumes:
      - doxly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doxly -d doxly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    # tasks/remediation-plan.md R3/R5/R6/R7 — the RQ consumer for all four
    # queues decisions.md ADR-008's job infrastructure now defines
    # (app/core/queue.py): document_processing, extraction, comparison,
    # summary. One generic worker role per architecture.md §2.3's own
    # description ("Consumes the RQ queue: document processing, embedding
    # generation, non-streaming LangGraph workflows" — singular role, not
    # four separate worker services), matching how this same command would
    # need to run on the container platform's single `worker` replica set
    # in production (deployment.md §4). Same image as the backend — no
    # separate Dockerfile.
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["rq", "worker", "document_processing", "extraction", "comparison", "summary", "--url", "redis://redis:6379"]
    environment:
      DATABASE_URL: postgresql+asyncpg://doxly:doxly@postgres:5432/doxly
      REDIS_URL: redis://redis:6379
      BACKEND_PUBLIC_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:3000
    volumes:
      - doxly-local-storage:/app/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        # Waits for `backend`'s own healthcheck (which only passes once its
        # `alembic upgrade head` has completed and uvicorn is serving) so
        # the worker never races a job against a not-yet-migrated schema.
        condition: service_healthy
    init: true

volumes:
  doxly-postgres-data:
  doxly-local-storage:
